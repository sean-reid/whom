name: setup-node
description: Install the Node version from .node-version and run npm ci

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm
    - run: npm ci
      shell: bash
