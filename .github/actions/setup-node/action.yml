name: setup-node
description: Install the Node version from .node-version and run npm ci

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: npm
    - run: npm ci
      shell: bash
