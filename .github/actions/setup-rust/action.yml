name: setup-rust
description: Install the stable Rust toolchain and restore the tools/pipeline cache

inputs:
  components:
    description: Comma-separated rustup components to install alongside the toolchain
    default: ""

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      with:
        toolchain: stable
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: tools/pipeline
