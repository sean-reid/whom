name: pipeline

on:
  schedule:
    - cron: "0 6 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      max_fetch:
        description: Most Commons image fetches this run
        default: "10000"
      sample:
        description: Stop after this many new people and skip retirement (blank for a full run)
        default: ""

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: cargo build --release --manifest-path tools/pipeline/Cargo.toml
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: tools/pipeline/target/release/pipeline download --out out
      - env:
          MAX_FETCH: ${{ inputs.max_fetch || '10000' }}
          SAMPLE: ${{ inputs.sample }}
        run: |
          set -- --out out --max-fetch "$MAX_FETCH"
          if [ -n "$SAMPLE" ]; then set -- "$@" --sample "$SAMPLE"; fi
          tools/pipeline/target/release/pipeline run "$@"
      - if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: tools/pipeline/target/release/pipeline upload --out out
