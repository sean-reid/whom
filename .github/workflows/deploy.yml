name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '860e267e26cbf52bdca301d114b3c203' }}

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://whom.dwainosaur.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup-node
      - name: require the deploy token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in Actions secrets"
            exit 1
          fi
      - run: npm run build
      - name: create the R2 bucket when missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          buckets=$(npx wrangler r2 bucket list)
          if ! printf '%s\n' "$buckets" | sed 's/\x1b\[[0-9;]*m//g' | grep -Eqx 'name:[[:space:]]+whom'; then
            npx wrangler r2 bucket create whom
          fi
      - name: set the worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PUZZLE_SEED: ${{ secrets.PUZZLE_SEED }}
        run: |
          for name in SESSION_SECRET PUZZLE_SEED; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set in Actions secrets"
              exit 1
            fi
            printf '%s' "$value" | npx wrangler secret put "$name"
          done
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: smoke
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 https://whom.dwainosaur.com/ | grep -qi whom
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 https://whom.dwainosaur.com/api/health | grep -q '"ok":true'
