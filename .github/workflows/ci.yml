name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright
          path: |
            playwright-report
            test-results
          retention-days: 7

  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check --manifest-path tools/pipeline/Cargo.toml
      - run: cargo clippy --all-targets --manifest-path tools/pipeline/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path tools/pipeline/Cargo.toml
